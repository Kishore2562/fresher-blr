(()=>{const pn=$('#panel'),pt=$('#ptr');let y0=0,dy=0,on=false;

let known=null;

function apiShim(){const A=CFG.api.replace(/\/$/,'')+'/api/posts',K=()=>{try{return JSON.parse(store.getItem('wb3k')||'{}')}catch(e){return{}}};
 const j=async(u,o={})=>{const ac=new AbortController(),t=setTimeout(()=>ac.abort(),70000);try{const r=await fetch(u,{...o,cache:'no-store',signal:ac.signal,headers:{'Content-Type':'application/json',...(o.headers||{})}});const b=await r.json().catch(()=>({}));if(!r.ok){const x=new Error(b.error||String(r.status));x.http=r.status;x.code=b.code;x.detail=b.detail;throw x}return b}finally{clearTimeout(t)}};
 let cb=null,er=null,busy=false;

 return{pull,add:async o=>{const tok=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36)+'xxxxxxxx');const{ts,flags,...d}=o;const r=await j(A,{method:'POST',body:JSON.stringify({d,token:tok})});try{store.setItem('wb3k',JSON.stringify({...K(),[r.id]:tok}))}catch(e){}return{id:String(r.id)}},

(async()=>{try{let c;if(CFG.api)c=apiShim();else{const db=await claude.use('db');if(!db)return;c=db.collection('posts')}dbc=c;let sig=null;
